<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070312"/>
      <stop offset="55%" stop-color="#160a30"/>
      <stop offset="100%" stop-color="#0a0420"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="220" fill="url(#bg)"/>

  <!-- scanlines -->
  <g stroke="#7c5cff" stroke-opacity="0.06">
    <line x1="0" y1="30" x2="900" y2="30"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="90" x2="900" y2="90"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
  </g>

  <!-- moon -->
  <circle cx="815" cy="52" r="46" fill="url(#moonGlow)">
    <animate attributeName="r" values="42;50;42" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="815" cy="52" r="22" fill="#d9d4ff"/>
  <circle cx="807" cy="45" r="4" fill="#b8b0e8"/>
  <circle cx="823" cy="58" r="3" fill="#b8b0e8"/>
  <circle cx="818" cy="40" r="2" fill="#b8b0e8"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="24" r="1.4"><animate attributeName="opacity" values="1;0.15;1" dur="2.3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="20" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="75" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="35" r="1.5"><animate attributeName="opacity" values="1;0.15;1" dur="2.1s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="18" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="120" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="28" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="70" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="22" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="88" r="1.2"><animate attributeName="opacity" values="1;0.15;1" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="30" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="150" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="150" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="140" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="70" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- flying pixel rocket -->
  <g transform="translate(-80,140)">
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="-80,140; 210,105; 460,150; 700,95; 980,130; -80,140"
      keyTimes="0;0.2;0.45;0.7;0.9;1"
      dur="20s" repeatCount="indefinite" calcMode="linear"/>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
        values="-3;3;-3" dur="1.4s" repeatCount="indefinite" additive="sum"/>
      <!-- flame -->
      <polygon points="-14,-6 -32,0 -14,6" fill="#ffd23f">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.18s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="-14,-3 -24,0 -14,3" fill="#ff8b3d">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="0.14s" repeatCount="indefinite"/>
      </polygon>
      <!-- fins -->
      <polygon points="0,-10 -16,-20 8,-10" fill="#7c5cff"/>
      <polygon points="0,10 -16,20 8,10" fill="#7c5cff"/>
      <!-- body -->
      <rect x="0" y="-10" width="40" height="20" fill="#ff5f56"/>
      <!-- nose -->
      <polygon points="40,-10 58,0 40,10" fill="#ffb454"/>
      <!-- window -->
      <circle cx="18" cy="0" r="5.5" fill="#0a0420" stroke="#9be8ff" stroke-width="2"/>
    </g>
  </g>

  <!-- title -->
  <text x="450" y="176" text-anchor="middle" filter="url(#softBlur)" font-family="'Courier New', monospace" font-size="34" font-weight="700" letter-spacing="4" fill="#7c5cff" opacity="0.7">MUHAMMAD ALI IMRAN</text>
  <text x="450" y="176" text-anchor="middle" font-family="'Courier New', monospace" font-size="34" font-weight="700" letter-spacing="4" fill="#f5f3ff">MUHAMMAD ALI IMRAN</text>

  <!-- subtitle -->
  <text x="450" y="200" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#9d8fd6">SENIOR SOFTWARE ENGINEER · SYSTEMS ARCHITECT · AI-NATIVE PRODUCTS</text>
</svg>
